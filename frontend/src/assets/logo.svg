<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car Icon -->
  <g transform="translate(5, 15)">
    <path d="M5 15 L10 8 L30 8 L35 15 L35 28 L32 32 L8 32 L5 28 Z" fill="url(#logoGradient)"/>
    <circle cx="12" cy="32" r="4" fill="#0B0B0D"/>
    <circle cx="28" cy="32" r="4" fill="#0B0B0D"/>
    <circle cx="12" cy="32" r="2.5" fill="#00E5FF"/>
    <circle cx="28" cy="32" r="2.5" fill="#00E5FF"/>
    <rect x="15" y="12" width="10" height="8" fill="#0B0B0D" rx="1"/>
  </g>
  
  <!-- AutoCare Text -->
  <text x="50" y="38" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">
    Auto<tspan fill="url(#logoGradient)">Care</tspan>
  </text>
</svg>
